<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PITBREAK 海外定价模拟器</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font:15px -apple-system,BlinkMacSystemFont,Arial}.wrap{max-width:620px;margin:auto;padding:24px 16px 70px}header{font-size:30px;font-weight:900}header small{display:block;font-size:10px;letter-spacing:2px;color:#aaa}h1{font-size:32px;margin:35px 0 10px}p{color:#aaa;font-size:13px;line-height:1.7}.hero{background:#eaff67;color:#111;border-radius:20px;padding:24px;margin:22px 0}.hero.loss{background:#ffb5a8}.hero b{font-size:50px;display:block;margin:8px 0}.card{background:#202222;border:1px solid #393b3b;border-radius:17px;padding:18px;margin:12px 0}.card h2{font-size:15px;margin:0 0 18px}.field{margin:0 0 22px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.top label{font-size:13px}.top input{background:#111;border:1px solid #555;border-radius:9px;color:#fff;width:90px;font-size:17px;text-align:right;padding:9px}.top span{font-size:11px;color:#aaa}input[type=range]{width:100%;accent-color:#eaff67}.ends{display:flex;justify-content:space-between;color:#999;font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{border:1px solid #444;border-radius:12px;padding:12px}.metric small{color:#aaa}.metric b{display:block;font-size:22px;margin-top:7px}.line{display:flex;justify-content:space-between;padding:7px 0;font-size:13px}.line span{color:#aaa}.buttons{display:flex;gap:10px}.buttons button{flex:1;border:0;border-radius:10px;padding:14px 5px;font-weight:800;background:#eaff67}.buttons button+button{background:#333;color:#fff}</style><div class="wrap"><header>PB.<small>PITBREAK / INTERNAL TOOL</small></header><h1>海外定价模拟器.</h1><p>微信内打开即可调节。拖动滑块或输入数值，实时查看单件贡献利润。仅供内部测算。</p><div class="hero" id="hero">单件贡献利润 · USD<b id="profit"></b><span id="margin"></span></div><div class="card"><h2>01 / 售价与采购</h2><div id="g1"></div></div><div class="card"><h2>02 / 物流与获客</h2><div id="g2"></div></div><div class="card"><h2>03 / 汇率与手续费</h2><div id="g3"></div></div><div class="card"><h2>关键指标</h2><div class="grid"><div class="metric"><small>保本售价</small><b id="break"></b></div><div class="metric"><small>总成本</small><b id="cost"></b></div><div class="metric"><small>贡献利润率</small><b id="rate"></b></div><div class="metric"><small>20%利润率售价</small><b id="target"></b></div></div></div><div class="card"><h2>成本明细 · USD</h2><div id="details"></div></div><div class="buttons"><button id="copy">复制结果</button><button id="reset">恢复默认</button></div><p>公式：利润 = 售价×(1−手续费率) − 供货价(CNY)÷汇率(CNY/USD) − 国际物流 − 获客成本。默认卖方承担物流。未包含税费、关税、包装、退货、破损、固定运营费用；不涉及合作分成。请按真实成本调整。</p></div><script>
const C=[['price','海外售价','USD',9.99,39.99,1,19.99,1],['supply','创作者供货价','CNY',20,70,5,40,1],['shipping','国际物流','USD',3,15,1,7,2],['ads','营销获客成本','USD',0,10,1,3,2],['exchange','汇率：1 USD = CNY','CNY',5,9,.1,7.1,3],['fee','支付交易费率','%',0,12,.5,4,3]],$=x=>document.getElementById(x),v={};let s={};try{s=JSON.parse(localStorage.getItem('pb-pricing')||'{}')}catch{};const usd=n=>'$'+n.toFixed(2);function calc(){let c=v.supply/v.exchange,f=v.price*v.fee/100,total=c+v.shipping+v.ads+f,p=v.price-total,r=100*p/v.price;$('profit').textContent=usd(p);$('margin').textContent='贡献利润率 '+r.toFixed(1)+'% · '+(p>=0?'预计盈利':'预计亏损');$('hero').classList.toggle('loss',p<0);$('break').textContent=usd((c+v.shipping+v.ads)/(1-v.fee/100));$('cost').textContent=usd(total);$('rate').textContent=r.toFixed(1)+'%';$('target').textContent=usd((c+v.shipping+v.ads)/(.8-v.fee/100));$('details').innerHTML=[['海外售价',v.price],['供货价折算',c],['国际物流',v.shipping],['获客成本',v.ads],['支付手续费',f],['贡献利润',p]].map(([a,b])=>'<div class="line"><span>'+a+'</span><b>'+usd(b)+'</b></div>').join('');try{localStorage.setItem('pb-pricing',JSON.stringify(v))}catch{}}for(let [id,label,unit,min,max,step,def,g] of C){v[id]=s[id]===undefined?def:Math.max(min,Math.min(max,+s[id]||0));let e=document.createElement('div');e.className='field';e.innerHTML='<div class="top"><label for="n'+id+'">'+label+'</label><div><span>'+unit+' </span><input type="number" inputmode="decimal" id="n'+id+'" value="'+v[id]+'"></div></div><input type="range" id="s'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+v[id]+'"><div class="ends"><span>'+min+'</span><span>'+max+'</span></div>';$('g'+g).append(e);$('n'+id).onchange=x=>{v[id]=Math.max(min,Math.min(max,Number(x.target.value)||def));$('n'+id).value=v[id];$('s'+id).value=v[id];calc()};$('s'+id).oninput=x=>{v[id]=+x.target.value;$('n'+id).value=v[id];calc()}}calc();$('reset').onclick=()=>{for(let [id,,,,, ,def] of C){v[id]=def;$('n'+id).value=def;$('s'+id).value=def}calc()};$('copy').onclick=async()=>{let t='PITBREAK 海外定价测算\n'+C.map(([id,label,unit])=>label+': '+v[id]+' '+unit).join('\n')+'\n利润 '+$('profit').textContent+'\n保本售价 '+$('break').textContent;try{if(navigator.clipboard)await navigator.clipboard.writeText(t);else if(navigator.share)await navigator.share({text:t});else throw Error();alert('已复制或分享')}catch{prompt('请长按复制',t)}};
</script></html>
