name: Stage HD product media

on:
  push:
    branches:
      - fix/product-images-hd-20261102

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/product-images-hd-20261102

      - name: Download original-resolution product photography
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/products/banana-leclerc public/images/products/lewis-hamilton-meme public/images/products/max-childhood-meme
          curl -L --fail --retry 3 'https://at.adobe.com/PffxVrq8ngiItDNI' -o public/images/products/banana-leclerc/front-hd-20261102.jpg
          curl -L --fail --retry 3 'https://at.adobe.com/VO9pJsAy0Xd2y1kN' -o public/images/products/banana-leclerc/back-hd-20261102.jpg
          curl -L --fail --retry 3 'https://at.adobe.com/d9RyEVMBW3fEuNhW' -o public/images/products/lewis-hamilton-meme/front-hd-20261102.jpg
          curl -L --fail --retry 3 'https://at.adobe.com/zYp2FE8mWWPE72g0' -o public/images/products/lewis-hamilton-meme/back-hd-20261102.jpg
          curl -L --fail --retry 3 'https://at.adobe.com/Ug8jvnO43fsxyNom' -o public/images/products/max-childhood-meme/front-hd-20261102.jpg
          curl -L --fail --retry 3 'https://at.adobe.com/cvkDVi25rKZbd5Rl' -o public/images/products/max-childhood-meme/back-hd-20261102.jpg

      - name: Verify JPEG dimensions
        shell: python
        run: |
          from pathlib import Path
          import struct

          files = list(Path('public/images/products').glob('*/*-hd-20261102.jpg'))
          if len(files) != 6:
              raise SystemExit(f'Expected 6 HD images, found {len(files)}')

          def jpeg_size(path):
              data = path.read_bytes()
              if data[:2] != b'\xff\xd8':
                  raise ValueError(f'{path} is not a JPEG')
              i = 2
              while i < len(data):
                  if data[i] != 0xFF:
                      i += 1
                      continue
                  while i < len(data) and data[i] == 0xFF:
                      i += 1
                  marker = data[i]
                  i += 1
                  if marker in (0xD8, 0xD9):
                      continue
                  length = struct.unpack('>H', data[i:i+2])[0]
                  if marker in {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}:
                      h, w = struct.unpack('>HH', data[i+3:i+7])
                      return w, h
                  i += length
              raise ValueError(f'No JPEG SOF marker in {path}')

          for path in files:
              w, h = jpeg_size(path)
              print(path, w, h, path.stat().st_size)
              if w < 1000 or h < 1200:
                  raise SystemExit(f'{path} is unexpectedly low resolution: {w}x{h}')

      - name: Point storefront at cache-busted HD files
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/data.ts')
          text = path.read_text()
          text = text.replace('max-childhood-meme/front.jpg', 'max-childhood-meme/front-hd-20261102.jpg')
          text = text.replace('max-childhood-meme/back.jpg', 'max-childhood-meme/back-hd-20261102.jpg')
          text = text.replace('lewis-hamilton-meme/front.jpg', 'lewis-hamilton-meme/front-hd-20261102.jpg')
          text = text.replace('lewis-hamilton-meme/back.jpg', 'lewis-hamilton-meme/back-hd-20261102.jpg')
          text = text.replace('banana-leclerc/front.jpg', 'banana-leclerc/front-hd-20261102.jpg')
          text = text.replace('banana-leclerc/back.jpg', 'banana-leclerc/back-hd-20261102.jpg')
          path.write_text(text)

      - name: Commit staged HD assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/products src/data.ts
          git commit -m 'Replace product media with original-resolution photography'
          git push origin HEAD:fix/product-images-hd-20261102
